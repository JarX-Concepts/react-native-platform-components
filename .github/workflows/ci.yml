name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs always finish, because a
  # cancelled run on main shows as "failing" on the README badge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build files
        run: yarn build

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Typecheck example and interaction tests
        run: yarn tsc -p example/tsconfig.json

      - name: Typecheck Expo example
        run: yarn tsc -p example-expo/tsconfig.json

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      - name: Build documentation
        run: yarn docs build

  test-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      # The Release Detox build still needs the toolchain on a Turbo cache hit.
      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      - name: Install emulator runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          df -h

      - name: Install Android emulator and system image
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd

      - name: Ensure Android AVD exists
        run: |
          if ! $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd | grep -q "Pixel_9_API_35"; then
            echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
              -n Pixel_9_API_35 \
              -k "system-images;android-35;google_apis;x86_64" \
              -d "pixel_7" \
              -c 2048M
          fi
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd | grep "Pixel_9_API_35"
          # A hardware keyboard, as the development AVDs have: the soft keyboard
          # then stays down and the demos' buttons below a focused field remain
          # tappable in the e2e flows
          config="$HOME/.config/.android/avd/Pixel_9_API_35.avd/config.ini"
          grep -q "^hw.keyboard=yes" "$config" || echo "hw.keyboard=yes" >> "$config"
          echo "ANDROID_AVD_HOME=$HOME/.config/.android/avd" >> $GITHUB_ENV
          echo "ANDROID_EMULATOR_EXTRA_ARGS=-no-window -no-snapshot -partition-size 2048 -gpu swiftshader_indirect" >> $GITHUB_ENV

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Detox e2e tests (Android)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          yarn workspace react-native-platform-components-example test:e2e:android:ci

      - name: Run native Android regressions
        working-directory: example/android
        run: |
          ./gradlew :app:connectedReleaseAndroidTest --no-daemon \
            -DtestBuildType=release \
            -Pandroid.testInstrumentationRunnerArguments.class=platformcomponents.example.NativeRegressionTest

      - name: Upload native Android test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-android-test-reports
          path: example/android/app/build/reports/androidTests
          if-no-files-found: ignore

      - name: Upload Detox artifacts (Android)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detox-android-artifacts
          path: example/artifacts
          if-no-files-found: ignore

  test-ios:
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26.6
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      # Detox rebuilds Release even when the Turbo Debug check is cached.
      # A cache hit contains no Pods or simulator tooling.
      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust --tap wix/brew
          brew install applesimutils

      - name: Install cocoapods
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      - name: Run Detox e2e tests (iOS)
        run: |
          yarn workspace react-native-platform-components-example detox clean-framework-cache
          yarn workspace react-native-platform-components-example detox build-framework-cache
          yarn workspace react-native-platform-components-example test:e2e:ios:ci

      # The Detox logs, plus the crash reports macOS writes when the simulated
      # app dies
      - name: Upload Detox logs and crash reports (iOS)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detox-ios-logs
          path: |
            example/artifacts/**/*.log
            example/artifacts/**/*.json
            /Users/runner/Library/Logs/DiagnosticReports/PlatformComponentsExample*
          if-no-files-found: ignore

  # These jobs build a throwaway app against old versions, so the compatibility
  # table is verified rather than asserted: without them, upgrading our own dev
  # dependencies could silently start requiring a newer React Native.
  #
  # iOS builds the declared floor (SDK 54). Android goes one release lower than
  # we promise (SDK 52 / RN 0.76), which keeps the native code portable: the
  # declared floor follows the supported React Native and Expo versions.
  build-floor-android:
    name: build-floor-android (Expo SDK 52 / RN 0.76, below the declared floor)
    runs-on: ubuntu-latest

    env:
      FLOOR_EXPO_SDK: 52
      FLOOR_IGNORE_PEERS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-floor-${{ hashFiles('scripts/setup-floor-app.sh') }}
          restore-keys: |
            ${{ runner.os }}-gradle-floor-

      - name: Build library
        run: yarn prepare

      - name: Create the minimum-version app
        run: ./scripts/setup-floor-app.sh android

      - name: Build the minimum-version app for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          cd "$RUNNER_TEMP/floor-app/android"
          # One ABI is enough to prove the native code compiles.
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

  build-floor-ios:
    name: build-floor-ios (Expo SDK 54 / RN 0.81)
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26.6
      FLOOR_EXPO_SDK: 54

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build library
        run: yarn prepare

      - name: Create the minimum-version app
        run: ./scripts/setup-floor-app.sh ios

      - name: Install CocoaPods dependencies
        run: |
          cd "$RUNNER_TEMP/floor-app/ios"
          pod install

      - name: Build the minimum-version app for iOS
        run: |
          cd "$RUNNER_TEMP/floor-app/ios"
          WORKSPACE="$(ls -d ./*.xcworkspace | head -1)"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$(basename "$WORKSPACE" .xcworkspace)" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # LiquidGlass uses iOS 26 APIs, but they are compiled out on older toolchains
  # (PCLiquidGlass.swift, PCSelectionMenu.swift) so the library does not force
  # Xcode 26 on everyone. This job is what keeps that true: it builds the
  # declared floor with an Xcode that has no iOS 26 SDK.
  build-legacy-xcode-ios:
    name: build-legacy-xcode-ios (Xcode 16.4, no iOS 26 SDK)
    runs-on: macos-15

    env:
      XCODE_VERSION: '16.4'
      FLOOR_EXPO_SDK: 54

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show the SDK in use
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator

      - name: Build library
        run: yarn prepare

      - name: Create the app
        run: ./scripts/setup-floor-app.sh ios

      - name: Install CocoaPods dependencies
        run: |
          cd "$RUNNER_TEMP/floor-app/ios"
          pod install

      - name: Build for iOS without the iOS 26 SDK
        run: |
          cd "$RUNNER_TEMP/floor-app/ios"
          WORKSPACE="$(ls -d ./*.xcworkspace | head -1)"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$(basename "$WORKSPACE" .xcworkspace)" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  build-expo-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-expo-${{ hashFiles('example-expo/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-expo-

      - name: Build library
        run: yarn prepare

      - name: Run Expo prebuild
        run: |
          yarn example-expo prebuild:clean

      - name: Build Expo example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          cd example-expo/android
          ./gradlew assembleRelease --no-daemon

  build-expo-ios:
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26.6

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build library
        run: yarn prepare

      - name: Run Expo prebuild
        run: |
          yarn example-expo prebuild:clean

      - name: Install CocoaPods dependencies
        run: |
          cd example-expo/ios
          pod install

      - name: Build Expo example for iOS
        run: |
          cd example-expo/ios
          xcodebuild -workspace PlatformComponentsExpoExample.xcworkspace \
            -scheme PlatformComponentsExpoExample \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
